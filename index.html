<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 모음</title>
<style>body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#1b1b2f;color:#fff;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;box-sizing:border-box}
a,summary{display:flex;align-items:center;gap:14px;width:min(340px,90vw);box-sizing:border-box;padding:14px 18px;border-radius:16px;background:#2b2b4a;color:#fff;text-decoration:none;font-weight:700}
summary{cursor:pointer;list-style:none;-webkit-user-select:none;user-select:none}summary::-webkit-details-marker{display:none}
summary::after{content:"›";margin-left:auto;font-size:26px;opacity:.6;transition:transform .2s}details[open]>summary::after{transform:rotate(90deg)}
details[open]>summary{background:#3a3a63}
.sub{display:flex;flex-direction:column;gap:8px;margin:8px 0 0 18px;padding-left:12px;border-left:2px solid #3a3a63}
.sub a{width:min(310px,calc(90vw - 30px));padding:10px 14px;background:#24243f}
.sub img{width:44px;height:44px;border-radius:11px}
img{width:56px;height:56px;border-radius:14px}small{display:block;font-weight:400;opacity:.7}
.stack{position:relative;width:56px;height:56px;flex:none}.stack img{position:absolute;width:42px;height:42px;border-radius:11px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.stack img:nth-child(1){left:0;top:0}.stack img:nth-child(2){left:14px;top:14px}.stack img:nth-child(3){left:7px;top:7px;z-index:1}</style></head>
<body><h2>게임 모음</h2>

<details><summary><span class="stack"><img src="land/icons/icon-192.png" alt=""><img src="erinn/icons/icon-192.png" alt=""><img src="ocean/icons/icon-192.png" alt=""></span><span>육성<small>다마고치 · 캐릭터 육성 3종</small></span></summary>
<div class="sub">
<a href="land/"><img src="land/icons/icon-192.png" alt=""><span>컬러 다마고치<small>육상편 · 30종 진화</small></span></a>
<a href="ocean/"><img src="ocean/icons/icon-192.png" alt=""><span>철갑상어 해양편<small>해양 생물 30종 진화</small></span></a>
<a href="erinn/"><img src="erinn/icons/icon-192.png" alt=""><span>에린 견습생 육성기<small>실시간 3D · 72개 최종 직업</small></span></a>
</div></details>

<details><summary><span class="stack"><img src="toysquad/icons/icon-192.png" alt=""><img src="toysquad2/icons/icon-192.png" alt=""></span><span>장난감 특공대<small>시리즈 2종</small></span></summary>
<div class="sub">
<a href="toysquad/"><img src="toysquad/icons/icon-192.png" alt=""><span>장난감 특공대<small>v0.32</small></span></a>
<a href="toysquad2/"><img src="toysquad2/icons/icon-192.png" alt=""><span>장난감 특공대 2<small>v2.2</small></span></a>
</div></details>

<a href="somsom-farm/"><img src="somsom-farm/icons/icon-192.png" alt=""><span>솜솜 농장<small>시험판 M3 · v1.0</small></span></a>
<a href="pixel-commando/"><img src="pixel-commando/icons/icon-192.png" alt=""><span>픽셀코만도<small>야간 항구 침투 · 잠입 작전</small></span></a>

<script>document.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)document.querySelectorAll('details').forEach(o=>{if(o!==d)o.open=false})}))</script>
</body></html>
