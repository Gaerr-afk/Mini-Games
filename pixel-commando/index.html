<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>픽셀코만도 — 야간 항구 침투</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="theme-color" content="#0f1a24"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=IBM+Plex+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--olive:#26311f;--olive2:#3b4a2f;--drab:#6b6a2e;--tape:#f2d35c;--paper:#d9cfae;--ink:#14151b;--red:#c8343a;--mint:#9ee8cc;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1b1f19;overflow:hidden;overscroll-behavior:none}
body{font:14px/1.45 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#eee8d4;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stageFrame{position:fixed;inset:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#stage{position:absolute;inset:0;overflow:hidden;background:#383b46}
#hud{position:absolute;inset:0;pointer-events:none;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#hud.idle .top,#hud.idle .bottom,#hud.idle #toast{visibility:hidden}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.panel{background:rgba(31,42,28,.86);border-left:3px solid var(--tape);padding:6px 10px;border-radius:2px 6px 6px 2px}
#obj p{margin:0;font-size:13px}#obj p.done{color:var(--mint)}#obj p.sub{opacity:.65;font-size:12px}#obj b{color:var(--tape);font-variant-numeric:tabular-nums}
.tm{font:20px/1 "Black Ops One","Impact",sans-serif;letter-spacing:.04em;border-left-color:var(--drab);font-variant-numeric:tabular-nums}
.alarm{visibility:hidden;align-self:center;background:var(--red);color:#fff;padding:5px 12px;border-radius:4px;font-weight:700}
.alarm.on{visibility:visible;animation:blink .5s steps(2) infinite}@keyframes blink{50%{background:#8e2630}}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);max-width:min(92vw,520px);background:rgba(20,21,27,.82);padding:7px 14px;border-radius:5px;opacity:0;transition:opacity .25s;text-align:center;font-size:13px}
#toast.show{opacity:1}#toast.warn{background:rgba(142,38,48,.9)}
.bottom{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.cards{display:flex;gap:6px}
.card,.act{pointer-events:auto;font:inherit;color:inherit;border:0;cursor:pointer}
.card{display:flex;align-items:center;gap:8px;background:rgba(31,42,28,.88);padding:6px 10px 6px 6px;border-radius:6px;outline:2px solid transparent;text-align:left;position:relative}
.card .face{width:30px;height:34px;border-radius:3px;background:linear-gradient(#1f3a22 0 30%,#d6a785 30% 70%,#3f7a3c 70%)}
.card.sapper .face{background:linear-gradient(#a8a050 0 34%,#f3d2b5 34% 70%,#8a8a3a 70%)}
.card b{display:block;font-size:13px}.card small{display:block;font-size:11px;opacity:.7}
.card .hp{display:block;font-style:normal;font-size:11px;margin-top:2px}.card .hp i{display:inline-block;width:9px;height:9px;margin-right:2px;border:1px solid var(--mint);border-radius:1px}.card .hp i.on{background:var(--mint)}.card .hp span{color:var(--tape)}
.card.sel{outline-color:var(--tape)}.card.seen{box-shadow:0 0 0 2px var(--red)}.card.dead{opacity:.4}
.card kbd,.act kbd{font:10px ui-monospace,monospace;opacity:.5;margin-left:4px}.card kbd{position:absolute;top:3px;right:5px}
.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.act{background:rgba(20,21,27,.78);padding:9px 11px;border-radius:5px;font-size:13px;min-width:44px;min-height:40px}
.act.on{background:var(--tape);color:var(--ink)}.act:disabled{opacity:.4}
.card:focus-visible,.act:focus-visible,#ov button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#hud.paused::after{content:"일시정지 — 명령은 계속 내릴 수 있습니다";position:absolute;left:50%;top:40%;transform:translateX(-50%);background:rgba(20,21,27,.75);padding:6px 12px;border-radius:4px;font-size:13px}
.mark{position:absolute;left:0;top:0;margin:-14px 0 0 -7px;font:700 20px/1 "Black Ops One",Impact,sans-serif;text-shadow:0 2px 0 #14151b,0 0 3px #14151b;display:none}
.mark.red{color:#ff5a5a}.mark.amb{color:var(--tape)}.mark.dim{color:#d9d9db;font-size:16px}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(27,31,25,.55);padding:16px}
#ov.on{display:flex}
.sheet{position:relative;width:min(460px,100%);background:var(--paper);color:var(--ink);padding:22px 22px 18px;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-.6deg)}
.sheet::before{content:"";position:absolute;left:50%;top:-11px;width:110px;height:24px;margin-left:-55px;background:rgba(242,211,92,.85);transform:rotate(2deg)}
.sheet .kick{margin:0 0 4px;font-size:12px;color:#5a3e28}
.sheet h1{margin:0 0 10px;font:400 clamp(30px,8vw,42px)/1 "Black Ops One",Impact,sans-serif;color:var(--olive)}.sheet h1 em{font-style:normal;color:var(--red)}.sheet h1 .dim{opacity:.22}
.sheet p{margin:0 0 10px}.sheet ul{margin:0 0 12px;padding-left:18px;font-size:13px}.sheet li{margin:3px 0}.sheet li b{color:var(--olive)}
.sheet .stats{font-weight:700}.sheet .best{color:#5a3e28;font-size:13px}
#ov button{pointer-events:auto;font:400 18px/1 "Black Ops One",Impact,sans-serif;letter-spacing:.06em;background:var(--olive);color:var(--tape);border:0;padding:13px 22px;border-radius:3px;cursor:pointer;width:100%}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
@media (pointer:coarse){.card kbd,.act kbd{display:none}}
@media (max-width:640px){#toast{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px))}.card small{display:none}.act{padding:8px 9px;font-size:12px}.acts{max-width:100%}.tm{font-size:16px}#obj p{font-size:12px}}
@media (prefers-reduced-motion:reduce){.alarm.on{animation:none}#toast{transition:none}}
/* ---- briefing (tactical map) ---- */
#ov{overflow:auto}
.sheet.brief{width:min(900px,100%);max-height:calc(100% - 8px);overflow:auto}
.brief .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.brief .txt h3{margin:4px 0 2px;font:400 15px/1.2 "Black Ops One",Impact,sans-serif;letter-spacing:.04em;color:#5a3e28}
.brief .txt ol{margin:0 0 6px;padding-left:20px;font-size:13px}.brief .sq{font-size:13px;margin:0 0 6px}.brief .sq b{color:var(--olive)}
.brief details{font-size:13px;margin:6px 0 10px}.brief summary{cursor:pointer;color:#5a3e28;font-weight:700}
.mapbox{background:#c9bd96;padding:6px;border:1px solid rgba(20,21,27,.25)}
.tac{display:block;width:100%;height:auto}
.tac .land{fill:#b7b07c}.tac .grid{stroke:rgba(20,21,27,.12);stroke-width:.06}.tac .water{fill:#6f8fb0}.tac .sand{fill:#d8c48c}
.tac .road{fill:#a98a62}.tac .yard{fill:#a8a49a}.tac .bush{fill:#4e7a3a;rx:.6}.tac .tree{fill:#3a5a30}.tac .dock{fill:#7a5a3c}
.tac .blk{fill:#3b3d44}.tac .blk.crate,.tac .blk.bags{fill:#6e5a40}.tac .blk.tanks{fill:#8e2630}
.tac text{font:700 1.15px "IBM Plex Sans KR",sans-serif;fill:#eee8d4;text-anchor:middle}.tac .tl{fill:#14151b;font-size:1.1px}
.tac .route{fill:none;stroke:#c8343a;stroke-width:.16;stroke-dasharray:.5 .35}.tac .gd{fill:#c8343a;stroke:#fbfbf8;stroke-width:.1}
.tac .fan{fill:rgba(200,52,58,.28);stroke:#c8343a;stroke-width:.08}
.tac .tgt{fill:#f2d35c;stroke:#14151b;stroke-width:.1}.tac .ex{fill:none;stroke:#2a7a64;stroke-width:.22;stroke-dasharray:.4 .25}.tac .st{fill:#2f5a30;stroke:#fbfbf8;stroke-width:.1}
.legend{margin:6px 0 0;font-size:11px;color:#383b46}.lg{display:inline-block;width:12px;height:8px;margin:0 3px 0 8px;vertical-align:middle}.lg.r{border-top:2px dashed #c8343a;height:0}.lg.f{background:rgba(200,52,58,.4)}.lg.b{background:#4e7a3a}
@media (max-width:680px){.brief .cols{grid-template-columns:1fr}.sheet.brief{padding:16px 14px 14px}}
/* ---- debrief ---- */
.sheet.debrief{width:min(440px,100%)}
.stamp{position:absolute;right:16px;top:18px;font:400 20px/1 "Black Ops One",Impact,sans-serif;letter-spacing:.06em;padding:6px 10px;border:3px solid;border-radius:4px;transform:rotate(-8deg);opacity:.85}
.stamp.ok{color:#2a7a64;border-color:#2a7a64}.stamp.ng{color:var(--red);border-color:var(--red)}
.stars i{display:inline-block;font-style:normal;color:rgba(20,21,27,.18);transform:scale(.3);animation:pop .35s cubic-bezier(.3,1.6,.5,1) forwards}.stars i.on{color:#e8a83a}
@keyframes pop{to{transform:scale(1)}}
.rank{margin:-4px 0 8px;font-size:14px}.rank b{color:var(--olive)}.rank .nb{color:var(--red)}
table.st{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:13px}table.st td{padding:4px 2px;border-bottom:1px dashed rgba(20,21,27,.25)}table.st td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:#5a3e28}
/* ---- alarm vignette, hit flash, intro letterbox ---- */
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at center,transparent 55%,rgba(200,30,40,.55) 100%)}
#vig.on{opacity:1;animation:vp 1.1s ease-in-out infinite}@keyframes vp{50%{opacity:.45}}
#vig.hit{animation:hitf .35s ease-out}@keyframes hitf{0%{opacity:1;background-color:rgba(200,30,40,.25)}100%{opacity:0}}
#vig.on.hit{animation:hitf .35s ease-out,vp 1.1s ease-in-out .35s infinite}
#stageFrame::before,#stageFrame::after{content:"";position:absolute;left:0;right:0;height:0;background:#0d0e12;z-index:5;transition:height .5s ease;pointer-events:none}
#stageFrame::before{top:0}#stageFrame::after{bottom:0}
#stageFrame.lbox::before,#stageFrame.lbox::after{height:11vh}
#cap{position:absolute;left:0;right:0;bottom:calc(11vh + 18px);text-align:center;z-index:6;opacity:0;transition:opacity .6s;pointer-events:none}
#cap.on{opacity:1}#cap b{display:block;font:400 clamp(26px,6vw,44px)/1 "Black Ops One",Impact,sans-serif;letter-spacing:.08em;color:var(--tape);text-shadow:0 3px 0 #14151b}
#cap span{display:block;margin-top:6px;font-size:13px;letter-spacing:.12em;color:#d9d9db}
@media (prefers-reduced-motion:reduce){#vig.on{animation:none}.stars i{animation:none;transform:none}#stageFrame::before,#stageFrame::after{transition:none}}
.tabs{display:flex;gap:6px;margin:-6px 0 8px;flex-wrap:wrap}
#ov .tab{width:auto;font:700 12px/1 "IBM Plex Sans KR",sans-serif;letter-spacing:0;padding:7px 10px;background:rgba(20,21,27,.12);color:var(--olive)}
#ov .tab.on{background:var(--olive);color:var(--tape)}
#ov button.next{margin-top:8px;background:#8e2630;color:#fbfbf8}
.tac .rail{stroke:#383b46;stroke-width:.35;stroke-dasharray:.25 .25}.tac .sab{fill:#9ee8cc;stroke:#14151b;stroke-width:.12}.tac .det{fill:#ff8a5a;stroke:#14151b;stroke-width:.12}
.mark.sm{font:700 12px/1 "IBM Plex Sans KR",sans-serif;margin:-8px 0 0 -14px;background:rgba(20,21,27,.6);padding:2px 4px;border-radius:3px}
.card.diver .face{background:linear-gradient(#24262f 0 34%,#d6a785 34% 62%,#2f5e9e 62% 70%,#24262f 70%)}
.cards{flex-wrap:wrap}
@media (max-width:640px){.card{padding:5px 8px 5px 5px}.card .face{width:24px;height:28px}}
.tac .wire{stroke:#14151b;stroke-width:.15;stroke-dasharray:.3 .2}.tac .rwy{fill:#4f535f}.tac .cmd{fill:none;stroke:#e8a83a;stroke-width:.3;stroke-dasharray:.6 .3}.tac .car{fill:#4a6c40;stroke:#14151b;stroke-width:.12}.tac .blk.wall{fill:#858892}.tac .blk.plane{fill:#4a6c40}
.card.sniper .face{background:linear-gradient(#4a6c40 0 38%,#c89a70 38%)}.card.agent .face{background:linear-gradient(#4f535f 0 34%,#f3d2b5 34% 80%,#2f5e9e 80%)}.card.driver .face{background:linear-gradient(#5a3e28 0 34%,#d6a785 34%)}.card.pow .face{background:linear-gradient(#696d78 0 30%,#d6a785 30%)}
#ov .tab{font-size:11px;padding:6px 8px}
.diff{display:block;margin:8px 0 6px;font-size:13px;line-height:1.35;background:rgba(47,90,48,.12);padding:7px 9px;border-radius:4px;cursor:pointer}.diff input{width:auto;margin-right:4px;vertical-align:-2px}
@media (max-width:640px){#toast{bottom:auto;top:calc(118px + env(safe-area-inset-top,0px));font-size:13px}.cards.many .card .face{display:none}.cards.many .card{padding:4px 7px}.cards.many .card b{font-size:12px}}
/* ---- finishing pass: tutorial checklist, minimap, alarm bar, icon buttons, mission progress ---- */
#tut{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:min(92vw,560px);background:rgba(232,168,58,.94);color:#14151b;padding:7px 12px;border-radius:5px;font-size:13px;pointer-events:none;box-shadow:0 3px 0 #14151b}
#tut b{margin-right:6px}
.act.hint,.cards.hint .card.sel{animation:hintp 1s ease-in-out infinite;outline:2px solid var(--tape)}@keyframes hintp{50%{outline-color:transparent}}
#mini{position:absolute;right:10px;top:54px;border:2px solid rgba(20,21,27,.8);border-radius:4px;image-rendering:pixelated;pointer-events:auto;opacity:.92;max-width:34vw}
.alarm{position:relative;overflow:hidden}.alarm::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--k,1)*100%);background:#ffe9a8}
.act .ic{font-style:normal;margin-right:4px}
.tab.done{opacity:.85}#ov .tab.done{background:rgba(47,90,48,.25)}.rec{font-size:12px;margin:-4px 0 8px;color:#8e2630}
@media (max-width:640px){.act.util span{display:none}.act.util .ic{margin:0}#tut{bottom:auto;top:calc(160px + env(safe-area-inset-top,0px));font-size:12px}#mini{top:48px;right:6px}}
@media (prefers-reduced-motion:reduce){.act.hint,.cards.hint .card.sel{animation:none}}
</style>
