<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솜솜 농장 — 시험판 M3</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="theme-color" content="#a9c8e6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#a9c8e6;--panel:#fff8ec;--panel2:#f6ead6;--ink:#4a3a2e;--soft:#8a7462;--stitch:#d9b99b;--go:#6fcfae;--goink:#1d4a3c;--sel:#ffd36b;--warn:#d07a66;--shadow:0 3px 0 rgba(74,58,46,.18),0 8px 18px rgba(40,60,90,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--panel:#2e2a36;--panel2:#3a3544;--ink:#f6efe6;--soft:#b9aebf;--stitch:#6b5d77;--go:#44a88a;--goink:#f3fff9;--sel:#e8a83a;--shadow:0 3px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--panel:#2e2a36;--panel2:#3a3544;--ink:#f6efe6;--soft:#b9aebf;--stitch:#6b5d77;--go:#44a88a;--goink:#f3fff9;--sel:#e8a83a;--shadow:0 3px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);overflow:hidden;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}
#hud{position:absolute;inset:0;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:inherit;font-size:.86em;background:var(--panel2);border:1px solid var(--stitch);border-radius:5px;padding:0 5px;margin:0 1px}
.panel{background:var(--panel);border:2px dashed var(--stitch);border-radius:16px;box-shadow:var(--shadow);outline:3px solid var(--panel)}
.top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.top>*{pointer-events:auto}
.brand{position:relative;padding:7px 12px;display:flex;align-items:baseline;gap:8px;font-size:17px;white-space:nowrap}
.brand b{font-weight:400}.brand .tag{font-size:12px;color:var(--soft)}
.brand .saved{position:absolute;left:8px;top:calc(100% + 8px);font-size:12px;color:var(--goink);background:var(--go);border-radius:8px;padding:1px 7px;opacity:0}
.brand .saved.pulse{animation:pulse 1.8s ease-out}
@keyframes pulse{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
.tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{pointer-events:auto;min-width:44px;height:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border:2px dashed var(--stitch);outline:3px solid var(--panel);border-radius:14px;box-shadow:var(--shadow)}
.btn:active{transform:translateY(2px)}
.btn.on{background:var(--sel);outline-color:var(--sel);color:#4a3a2e;border-color:#b98660}
.btn.off{color:var(--soft)}
.btn:focus-visible,.slot:focus-visible,.big:focus-visible{outline:3px solid var(--go)}
.toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-8px);max-width:min(86%,420px);text-align:center;padding:8px 14px;border-radius:14px;background:var(--ink);color:var(--panel);font-size:15px;opacity:0;transition:opacity .18s,transform .18s}
.toast.on{opacity:.94;transform:translate(-50%,0)}
.bottom{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.modes{display:flex;gap:8px}
.mode{height:46px;padding:0 14px;font-size:16px}
.hotbar{pointer-events:auto;display:flex;gap:6px;padding:8px;max-width:calc(100% - 20px);overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
.hotbar::-webkit-scrollbar{display:none}
.slot{position:relative;flex:0 0 auto;width:52px;height:62px;padding:5px 0 0;background:var(--panel2);border:2px solid transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.slot .sw{width:26px;height:26px;border-radius:5px;background:linear-gradient(var(--t) 0 34%,var(--l) 34% 46%,var(--s) 46% 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.slot b{font-weight:400;font-size:13px;line-height:1}
.slot em{font-style:normal;font-size:10.5px;color:var(--soft);line-height:1.1}
.slot kbd{position:absolute;left:2px;top:1px;font-size:9px;border:0;background:none;color:var(--soft);padding:0}
.slot.sel{border-color:#b98660;background:var(--sel);color:#4a3a2e}.slot.sel em{color:#6e4a32}
.slot.none .sw{opacity:.35}.slot.none b{color:var(--warn)}
.hint{position:absolute;left:12px;bottom:14px;max-width:300px;font-size:12.5px;line-height:1.7;color:var(--ink);background:color-mix(in srgb,var(--panel) 82%,transparent);border-radius:12px;padding:6px 10px}
.sh-stick{pointer-events:auto;position:absolute;left:18px;bottom:146px;width:124px;height:124px;border-radius:50%;background:color-mix(in srgb,var(--panel) 55%,transparent);border:2px dashed var(--stitch);touch-action:none}
.sh-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--panel);border:2px solid var(--stitch);box-shadow:var(--shadow)}
.sh-stick.on .sh-knob{background:var(--sel)}
.sh-perf{position:fixed;left:8px;top:calc(64px + env(safe-area-inset-top,0px));z-index:9;white-space:pre;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#eaffea;background:rgba(10,20,10,.72);padding:6px 8px;border-radius:8px;pointer-events:none}
.ov{pointer-events:auto;position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:rgba(40,52,78,.3)}
.card{width:min(100%,400px);padding:22px 20px 16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.card h1{margin:0;font-weight:400;font-size:38px;letter-spacing:.02em}
.card h2{margin:0;font-weight:400;font-size:26px}
.card p{margin:0}
.lead{font-size:16px;line-height:1.55;color:var(--ink);text-wrap:pretty;word-break:keep-all}
.how{font-size:13.5px;line-height:1.7;color:var(--soft);word-break:keep-all;margin-top:4px}
.fine{font-size:12px;color:var(--soft)}
.big{height:50px;border-radius:14px;border:2px dashed var(--stitch);background:var(--panel2);font-size:18px}
.big.go{background:var(--go);color:var(--goink);border-color:color-mix(in srgb,var(--goink) 45%,transparent)}
.big.warn{background:var(--warn);color:#fff;border-color:#8e2630}
.big:active{transform:translateY(2px)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:16px;line-height:1.6}
@media (pointer:coarse){.bottom{align-items:flex-end;padding:0 10px}.modes{flex-direction:column;margin-bottom:6px}.mode{height:52px;min-width:104px}.hotbar{align-self:center}}
@media (max-width:520px){.brand .tag{display:none}.brand{font-size:15px;padding:8px 10px}.top{left:8px;right:8px}.tools{gap:5px;flex-wrap:nowrap}.tools .btn{min-width:40px;height:40px;padding:0 6px;border-radius:12px}}

.quest{pointer-events:auto;position:absolute;left:12px;top:66px;width:min(236px,calc(100% - 24px));padding:8px 11px 9px;cursor:pointer}
.quest .qh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--soft)}
.gold{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-size:15px}
.gold i{width:14px;height:14px;border-radius:50%;background:#ffd36b;box-shadow:inset 0 0 0 2px #e8a83a,inset -2px -2px 0 2px #f2d35c}
.gold b{font-weight:400}
.quest .qt{font-size:16px;margin-top:3px;word-break:keep-all}
.qbar{height:8px;margin:6px 0 4px;border-radius:5px;background:var(--panel2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--stitch)}
.qbar i{display:block;height:100%;width:0;background:var(--go);border-radius:5px;transition:width .25s}
.quest .qr{font-size:12px;color:var(--soft);word-break:keep-all}
.reward{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 24px;border-radius:20px;background:var(--sel);color:#4a3a2e;border:3px dashed #b98660;box-shadow:var(--shadow);opacity:0;pointer-events:none;text-align:center;min-width:220px;word-break:keep-all}
.reward b{font-weight:400;font-size:26px;white-space:nowrap}.reward span{font-size:15px}.reward em{font-style:normal;font-size:17px;color:#7a3a22}
.reward.on{animation:pop 2.8s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}8%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}14%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.card.shop{width:min(100%,430px);gap:9px;padding:16px 14px 12px;text-align:left}
.shead{display:flex;justify-content:space-between;align-items:center}
.big-gold{font-size:20px}.big-gold i{width:18px;height:18px}
.stabs{display:flex;gap:6px}
.stab{flex:1;height:40px;border-radius:12px;border:2px dashed var(--stitch);background:var(--panel2);font-size:15px}
.stab.on{background:var(--sel);color:#4a3a2e;border-color:#b98660}
.slist{display:flex;flex-direction:column;gap:6px;max-height:min(52vh,420px);overflow-y:auto;touch-action:pan-y;padding-right:2px}
.srow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:12px;background:var(--panel2)}
.srow .sw{flex:0 0 auto;width:26px;height:26px;border-radius:5px;background:linear-gradient(var(--t) 0 34%,var(--l) 34% 46%,var(--s) 46% 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.pdot{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 65%,var(--b) 0 34%,var(--a) 36%);box-shadow:0 0 0 2px var(--stitch)}
.srow .sn{flex:1;display:flex;flex-direction:column;font-size:15px;line-height:1.2;min-width:0}
.srow .sn small{font-size:11.5px;color:var(--soft)}
.sbtns{display:flex;gap:5px}
.sbtn{min-width:48px;height:38px;padding:0 9px;border-radius:10px;border:2px solid color-mix(in srgb,var(--goink) 35%,transparent);background:var(--go);color:var(--goink);font-size:14px}
.sbtn.dim{background:var(--panel);color:var(--soft);border-color:var(--stitch)}
.sbtn.on{background:var(--sel);color:#4a3a2e;border-color:#b98660}
.sbtn:active{transform:translateY(2px)}
.ssub{font-size:12.5px;color:var(--soft);margin:4px 2px 0}
@media (max-width:520px){.quest{top:58px;left:8px;width:200px;padding:6px 9px 7px}.quest .qt{font-size:14.5px}.toast{top:170px}}

.htabs{pointer-events:auto;display:flex;gap:4px;margin-bottom:-4px}
.htab{height:30px;padding:0 12px;border-radius:10px 10px 0 0;border:2px dashed var(--stitch);border-bottom:0;background:var(--panel2);font-size:13.5px;color:var(--soft)}
.htab.on{background:var(--panel);color:var(--ink)}
.slot .sw.sh{border-radius:50%}
.slot.item{opacity:.85}.slot.item em{color:var(--soft)}
.brand .clock{font-size:12px;color:var(--soft);padding:1px 6px;border-radius:7px;background:var(--panel2)}
.brand .clock.night{background:#3a2c50;color:#f6efe6}.brand .clock.dusk,.brand .clock.dawn{background:#f5a04a;color:#4a3a2e}
.srow .sn small .lack{color:var(--warn)}
.card.shop .stab{font-size:14px;padding:0 4px}
@media (pointer:coarse){.htabs{align-self:center}}
@media (max-width:520px){.brand .clock{display:none}}

.talkbtn{background:var(--go);color:var(--goink);outline-color:var(--go)}
.mode.bite{background:#c8343a;color:#fff;outline-color:#c8343a;animation:shake .25s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.card.talk{text-align:left;gap:8px}
.thead{display:flex;align-items:center;gap:8px;font-size:20px}.thead b{font-weight:400}
.hearts{margin-left:auto;color:#e08aa8;font-size:13px;letter-spacing:1px}
.tline{font-size:17px;line-height:1.55;word-break:keep-all;background:var(--panel2);border-radius:12px;padding:10px 12px}
.tnote{font-size:13px;color:var(--soft)}
.treq{display:flex;align-items:center;gap:9px;font-size:15px}.treq span{display:flex;flex-direction:column}.treq small{font-size:12px;color:var(--soft)}
.treq .sw{width:26px;height:26px;border-radius:50%;background:linear-gradient(var(--t) 0 34%,var(--l) 34% 46%,var(--s) 46% 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.dexgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dexcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:var(--panel2);font-size:13px;text-align:center}
.dexcell b{font-weight:400}.dexcell small{font-size:10.5px;color:var(--soft)}
.dexcell .sw{width:26px;height:26px;border-radius:50%;background:linear-gradient(var(--t) 0 40%,var(--s) 40% 100%)}
.dexcell .sw.unk{background:var(--stitch);opacity:.5}.dexcell.unk{color:var(--soft)}
.card.shop .stab{font-size:13px}

.upbtn{font-size:14px}
@media (pointer:coarse){.upbtn{min-width:104px}}
</style>
