  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

    #hud b { font-size: 20px; }
    #hud .warn { color: #ffb4b4; }
    #help { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: rgba(20, 24, 40, .45); color: #fff; font-size: 13px; pointer-events: none; }
