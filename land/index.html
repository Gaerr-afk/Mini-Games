<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="컬러 타마">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>컬러 다마고치</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #1b1b2f 0%, #162447 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #222; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; padding: max(12px, env(safe-area-inset-top)) 0 max(12px, env(safe-area-inset-bottom));
  }
  .device {
    width: min(380px, calc(100vw - 10px)); background: linear-gradient(160deg, #ff6fa8, #ff9bc1);
    border-radius: 190px 190px 170px 170px / 200px 200px 150px 150px;
    padding: 46px 28px 34px; box-shadow: 0 25px 60px rgba(0,0,0,.5), inset 0 -8px 20px rgba(0,0,0,.15), inset 0 6px 12px rgba(255,255,255,.4);
    position: relative;
  }
  .brand { text-align: center; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); font-size: 14px; margin-bottom: 10px; }
  .screen-frame { background: #3b2a3a; border-radius: 18px; padding: 10px; box-shadow: inset 0 3px 8px rgba(0,0,0,.6); }
  .screen { background: #cfe8d8; border-radius: 10px; overflow: hidden; position: relative; }
  canvas { display: block; width: 100%; image-rendering: pixelated; }
  #cv, .dex-cell canvas { image-rendering: auto; }
  .hud { display: flex; justify-content: space-between; padding: 6px 10px 2px; font-size: 11px; font-weight: 700; color: #2d4a3a; }
  .stats { padding: 4px 10px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .stat { font-size: 10px; color: #2d4a3a; font-weight: 700; }
  .bar { height: 7px; background: #a9c9b5; border-radius: 4px; overflow: hidden; margin-top: 2px; }
  .bar i { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
  .msg { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.92); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; color: #333; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; z-index: 2; }
  .msg.show { opacity: 1; }
  .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  button {
    border: none; border-radius: 14px; padding: 12px 4px; font-size: 13px; font-weight: 800; cursor: pointer;
    background: #fff5fa; color: #c2185b; box-shadow: 0 4px 0 #d9457f, 0 6px 10px rgba(0,0,0,.2); transition: transform .05s, box-shadow .05s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9457f; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button span { display: block; font-size: 18px; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 10px; color: #fff; opacity: .9; }
  .footer a { color: #fff; cursor: pointer; text-decoration: underline; margin-left: 9px; }
  .footer a.speed { background: rgba(255,255,255,.25); padding: 2px 7px; border-radius: 8px; text-decoration: none; font-weight: 800; }
  .overlay { position: absolute; inset: 0; background: rgba(20,20,40,.9); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 10px; z-index: 3; }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 20px; }
  .overlay p { font-size: 11px; line-height: 1.6; opacity: .9; white-space: pre-line; }
  .overlay input { padding: 8px 12px; border-radius: 8px; border: none; font-size: 14px; text-align: center; width: 180px; }
  .overlay button { padding: 8px 20px; font-size: 12px; }
  .palette { display: flex; gap: 8px; justify-content: center; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; display:flex; align-items:center; justify-content:center; font-size: 14px; }
  .swatch.sel { border-color: #fff; }
  /* 패널 (도감/상점) */
  .panel { position: absolute; inset: 0; background: #2b2540; color: #fff; display: none; flex-direction: column; z-index: 3; }
  .panel.show { display: flex; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 12px; font-weight: 800; background: #1c1830; }
  .panel-head a { cursor: pointer; text-decoration: underline; font-weight: 400; }
  .panel-body { overflow-y: auto; padding: 8px; flex: 1; }
  .sec-title { font-size: 11px; font-weight: 800; margin: 6px 0 4px; }
  .dex-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .dex-cell { background: rgba(255,255,255,.08); border-radius: 8px; padding: 4px 2px; text-align: center; font-size: 9px; line-height: 1.2; }
  .dex-cell canvas { width: 40px; height: 40px; margin: 0 auto 2px; }
  .dex-cell.locked { opacity: .45; }
  .note { font-size: 9px; opacity: .8; line-height: 1.5; margin-top: 8px; }
  .shop-row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); border-radius: 8px; padding: 4px 8px; margin-bottom: 4px; font-size: 10px; }
  .shop-row canvas { width: 32px; height: 32px; flex: none; background: rgba(0,0,0,.2); border-radius: 4px; }
  .shop-row .nm { flex: 1; font-weight: 700; }
  .shop-row .nm small { display: block; font-weight: 400; opacity: .7; }
  .shop-row button { padding: 5px 10px; font-size: 10px; border-radius: 8px; box-shadow: 0 2px 0 #d9457f; }
  .shop-row button.on { background: #ffd93d; color: #5a3a00; box-shadow: 0 2px 0 #b89b00; }
</style>
</head>
<body>
<div class="device">
  <div class="brand">COLOR TAMA</div>

        <div class="stat">❤️ 건강 <div class="bar"><i id="bHealth" style="background:#f0567a"></i></div></div>
      </div>
      <div class="msg" id="msg"></div>
      <div class="overlay" id="overlay">

        <div class="palette" id="palette"></div>
        <p id="elHint" style="font-size:10px"></p>
        <button id="ovBtn">시작하기</button>
      </div>
      <div class="panel" id="dex">
        <div class="panel-head"><span>📖 진화 도감 <span id="dexCount"></span></span><a id="dexClose">닫기 ✕</a></div>
        <div class="panel-body" id="dexBody"></div>
      </div>
      <div class="panel" id="shop">
        <div class="panel-head"><span>🛍️ 꾸미기 상점 <span id="shopPts"></span></span><a id="shopClose">닫기 ✕</a></div>
        <div class="panel-body" id="shopBody"></div>
      </div>
    </div>
  </div>
  <div class="buttons">
    <button id="btnFeed"><span>🍖</span>밥주기</button>
    <button id="btnPlay"><span>🎮</span>놀기</button>
    <button id="btnSleep"><span>💤</span>잠자기</button>
    <button id="btnClean"><span>🧹</span>청소</button>
    <button id="btnMed"><span>💊</span>치료</button>
    <button id="btnShop"><span>🛍️</span>꾸미기</button>
  </div>
  <div class="footer"><span id="saveInfo">자동 저장</span><span><a class="speed" id="speedBtn">⏩ 1x</a><a id="lightBtn">조명</a><a id="dexBtn">도감</a><a id="resetBtn">초기화</a></span></div>
</div>

  const ctx = cv.getContext('2d'); ctx.scale(3, 3); ctx.imageSmoothingQuality = 'high';   // 내부 해상도 3배, 좌표계는 160x110 유지
  const $ = id => document.getElementById(id);
  let pet = null, shop = null;
  let anim = { action: null, actionUntil: 0 };
  let lightsOff = false, speedIdx = 0;

  const defaultPet = (name, element) => ({
    name, element, color: ELEMENTS.find(e => e.id === element).color,
    gameMs: 0, last: Date.now(),
    hunger: 80, happy: 80, energy: 80, health: 100,
    poop: 0, sick: false, sleeping: false, dead: false, weight: 5,
    playCount: 0, sickCount: 0, careSum: 0, careN: 0, species: null,
    weather: 'sunny', weatherLeft: GAME_DAY_MS * 0.2,
  });
  const defaultShop = () => ({ points: 0, owned: [], equip: {}, deco: [] });

  const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
  const ageDays = p => Math.floor(p.gameMs / GAME_DAY_MS);
  const stageOf = p => { const a = ageDays(p); let s = 0; STAGES.forEach((st, i) => { if (a >= st.minAge) s = i; }); return s; };
  const speciesOf = p => p.species ? SPECIES[p.species.el][p.species.br] : null;
  const weatherOf = p => WEATHERS.find(w => w.id === p.weather) || WEATHERS[0];
  const decoOn = id => shop.deco.includes(id);
  const isNight = () => lightsOff || pet.sleeping;

  function save() {
    localStorage.setItem(SAVE_KEY, JSON.stringify(pet)); localStorage.setItem(SHOP_KEY, JSON.stringify(shop));
    $('saveInfo').textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }
  const loadJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
  function addDex(key) { const d = loadJSON(DEX_KEY, []); if (!d.includes(key)) { d.push(key); localStorage.setItem(DEX_KEY, JSON.stringify(d)); } }
  function showMsg(t, ms = 1800) { const m = $('msg'); m.textContent = t; m.classList.add('show'); clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('show'), ms); }

  // ================= 진화 판정 =================
  function decideBranch(p) {
    const care = p.careN > 0 ? p.careSum / p.careN : 50;
    if (p.sickCount >= 2 || p.health < 40) return 4;
    if (care >= 80) return 1;
    if (p.weight >= 9) return 2;
    if (p.playCount >= 25 || p.weight <= 4) return 3;
    return 0;
  }
  function evolveFinal() {
    const br = decideBranch(pet);
    pet.species = { el: pet.element, br };
    addDex(pet.element + ':' + br);
    showMsg(`✨ ${speciesOf(pet).name}(으)로 최종 진화! [${BRANCHES[br]}]`, 4000);
  }

  // ================= 시간 경과 (게임 시간 기준) =================
  function tick(dtReal, speed) {
    if (pet.dead) return;
    const dtGame = dtReal * speed;
    pet.gameMs += dtGame;
    const h = dtGame / 3600000;
    const w = weatherOf(pet);
    // 날씨 교대
    pet.weatherLeft -= dtGame;
    if (pet.weatherLeft <= 0) {
      const pool = ['sunny', 'sunny', 'cloudy', 'cloudy', 'rain', 'snow', 'rainbow'];
      pet.weather = pool[Math.floor(Math.random() * pool.length)];
      pet.weatherLeft = GAME_DAY_MS * (0.1 + Math.random() * 0.25);
    }
    const rate = pet.sleeping ? 0.4 : 1;
    let happyMul = (w.id === 'rain' && decoOn('umbrella')) ? 1.0 : w.happyMul;
    DECOS.forEach(d => { if (d.effect === 'happy' && decoOn(d.id)) happyMul *= 0.9; });
    pet.hunger = clamp(pet.hunger - 8 * h * rate);
    pet.happy = clamp(pet.happy - 6 * h * rate * happyMul);
    pet.energy = pet.sleeping ? clamp(pet.energy + 60 * h) : clamp(pet.energy - 5 * h);
    pet.poop = clamp(pet.poop + 0.6 * h, 0, 4);
    let dh = 0;
    if (pet.hunger < 20) dh -= 5 * h;
    if (pet.poop >= 3) dh -= 4 * h;
    if (pet.sick) dh -= 8 * h;
    if (pet.hunger > 50 && pet.happy > 50 && !pet.sick && pet.poop < 2) dh += 3 * h;
    pet.health = clamp(pet.health + dh);
    if (!pet.sick && (pet.poop >= 3 || pet.hunger < 15) && Math.random() < 0.15 * h) { pet.sick = true; pet.sickCount++; }
    if (pet.sleeping && pet.energy >= 100) { pet.sleeping = false; }
    if (stageOf(pet) < 3) { pet.careSum += (pet.hunger + pet.happy) / 2 * h; pet.careN += h; }
    // 행복 포인트: 깨어 있고 행복 70 이상이면 게임 1시간당 10
    if (!pet.sleeping && pet.happy >= 70 && stageOf(pet) > 0) shop.points += 10 * h;
    if (pet.health <= 0) pet.dead = true;
  }

  // ================= 렌더링 =================
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
    return `rgb(${r},${g},${b})`;
  }
  function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function drawMap(c, rows, pal, x, y, s, eyesClosed) {
    for (let r = 0; r < rows.length; r++) for (let q = 0; q < rows[r].length; q++) {
      let ch = rows[r][q]; if (ch === '.') continue;
      if (ch === 'E' && eyesClosed) ch = 'D';
      c.fillStyle = pal[ch] || '#000'; c.fillRect(Math.round(x + q * s), Math.round(y + r * s), Math.ceil(s), Math.ceil(s));
    }
  }
  const spritePal = pal => ({ ...pal, E: '#1a1a1a', W: '#ffffff' });

  function drawBg(t) {
    const w = weatherOf(pet), night = isNight();
    if (night) {
      px(0, 0, 160, 110, '#1a1f3a');
      for (let i = 0; i < 12; i++) { const sx = (i * 37 + 11) % 160, sy = (i * 23 + 7) % 70; if ((t + i) % 3 !== 0) px(sx, sy, 2, 2, '#f5f3ce'); }
      px(0, 86, 160, 24, w.id === 'snow' ? '#c9cfe0' : '#262b4d');
    } else {
      const sky = { sunny: '#bfe6ff', cloudy: '#c9d3dc', rain: '#8fa3b5', snow: '#dfe8f0', rainbow: '#cdeaff' }[w.id];
      px(0, 0, 160, 110, sky);
      px(0, 86, 160, 24, w.id === 'snow' ? '#f4f7fb' : '#7ed67e'); px(0, 86, 160, 3, w.id === 'snow' ? '#fff' : '#a2e6a2');
      if (w.id === 'rainbow') { ['#ff6b6b', '#ffa94d', '#ffe066', '#8ce99a', '#74c0fc', '#b197fc'].forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(110, 90, 60 - i * 2.5, Math.PI, 2 * Math.PI); ctx.stroke(); }); }
      const cc = (w.id === 'rain') ? '#5c6b7a' : (w.id === 'cloudy' ? '#eef1f4' : '#fff');
      const cx = (t * 0.4) % 200 - 40;
      px(cx, 14, 24, 8, cc); px(cx + 6, 9, 14, 6, cc); px(cx + 90, 26, 20, 7, cc); px(cx + 95, 22, 10, 5, cc);
      if (w.id === 'cloudy' || w.id === 'rain') { px(cx + 40, 6, 30, 9, cc); px(cx + 48, 2, 16, 6, cc); px(cx + 130, 12, 26, 8, cc); }
      if (w.id === 'sunny' || w.id === 'rainbow') { px(136, 8, 14, 14, '#ffd93d'); px(133, 11, 20, 8, '#ffd93d'); px(139, 5, 8, 20, '#ffd93d'); }
    }
    // 강수
    if (w.id === 'rain') for (let i = 0; i < 24; i++) { const x = (i * 29 + t * 3) % 160, y = (i * 41 + t * 6) % 90; px(x, y, 1, 5, 'rgba(120,170,230,.8)'); }
    if (w.id === 'snow') for (let i = 0; i < 20; i++) { const x = (i * 31 + Math.sin((t + i) * 0.1) * 6 + 80) % 160, y = (i * 37 + t * 1.2) % 92; px(x, y, 2, 2, '#fff'); }
  }

  function drawDecoBack(t) {
    const night = isNight();
    if (decoOn('garland')) { const cols = ['#ff6b6b', '#ffe066', '#8ce99a', '#74c0fc', '#f783ac']; for (let i = 0; i < 10; i++) { px(8 + i * 16, 4 + (i % 2) * 3, 4, 4, (t % 20 < 10) === (i % 2 === 0) || night ? cols[i % 5] : shade(cols[i % 5], -60)); px(8 + i * 16 + 4, 5 + (i % 2) * 3, 12, 1, '#555'); } }
    if (decoOn('fence')) for (let x = 0; x < 160; x += 12) { px(x + 2, 72, 4, 14, '#d9b382'); px(x, 75, 12, 2, '#c49a6c'); px(x, 81, 12, 2, '#c49a6c'); }
    DECOS.forEach(d => { if (d.map && decoOn(d.id)) drawMap(ctx, d.map, d.pal, d.x, d.y, d.s); });
    if (decoOn('lamp') && night) { ctx.fillStyle = 'rgba(255,240,150,.18)'; ctx.beginPath(); ctx.arc(142, 48, 22, 0, Math.PI * 2); ctx.fill(); }
    if (decoOn('sign')) { px(108, 54, 44, 14, '#8b5a2b'); px(110, 56, 40, 10, '#f5deb3'); px(126, 68, 3, 18, '#6d4422'); px(133, 68, 3, 18, '#6d4422'); ctx.fillStyle = '#5a3a1a'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pet.name, 130, 64); ctx.textAlign = 'left'; }
    if (decoOn('rug')) { px(46, 84, 68, 10, '#c0392b'); px(50, 86, 60, 6, '#e74c3c'); for (let x = 54; x < 106; x += 8) px(x, 88, 4, 2, '#f9e79f'); }
    if (decoOn('flowers')) { const cols = ['#ff6b9d', '#ffd93d', '#a78bfa', '#ff8c42', '#fff']; for (let i = 0; i < 9; i++) { const x = 4 + i * 18 + (i % 2) * 5; px(x + 1, 80, 1, 5, '#2e7d32'); px(x, 78, 3, 3, cols[i % 5]); px(x + 1, 79, 1, 1, '#fff'); } }
    if (decoOn('tree') && !night && weatherOf(pet).id === 'sunny') { ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(10, 86, 40, 6); }
  }

  function drawPoop(n) {
    for (let i = 0; i < Math.floor(n); i++) {
      const x = 112 + (i % 2) * 14, y = 76 - Math.floor(i / 2) * 2;
      px(x + 2, y, 8, 4, '#8b5a2b'); px(x, y + 4, 12, 5, '#6d4422'); px(x + 4, y - 3, 4, 3, '#8b5a2b');
    }
  }

  function drawWear(box) {
    // box: {top, headCX, headW, u, bodyCX, bodyTop, bodyH}
    const eq = shop.equip;
    const item = slot => ITEMS.find(i => i.id === eq[slot]);
    const hat = item('hat'), face = item('face'), neck = item('neck'), outfit = item('outfit');
    const uh = clamp(box.headW / 8, box.u * 0.6, box.u);
    if (outfit) drawMap(ctx, outfit.map, outfit.pal, box.bodyCX - 4 * box.u, box.outfitY != null ? box.outfitY : box.bodyTop + box.bodyH * 0.5, box.u);
    if (neck) drawMap(ctx, neck.map, neck.pal, box.headCX - 4 * uh, box.neckY != null ? box.neckY : box.bodyTop + box.bodyH * 0.42, uh);
    if (face) drawMap(ctx, face.map, face.pal, box.headCX - 4 * uh, box.eyeY - uh * 0.5, uh);
    if (hat) drawMap(ctx, hat.map, hat.pal, box.headCX - 4 * uh, box.top - hat.map.length * uh + uh, uh);
  }

  function drawPet(t) {
    const c = pet.color, dark = shade(c, -45), light = shade(c, 50);
    const stage = stageOf(pet);
    const bob = pet.sleeping ? 0 : Math.round(Math.sin(t * 0.25) * 2);
    let ox = 64, oy = 30 + bob;
    const playing = anim.action === 'play' && Date.now() < anim.actionUntil;
    const feeding = anim.action === 'feed' && Date.now() < anim.actionUntil;
    if (playing) { ox += Math.round(Math.sin(t * 0.8) * 16); oy -= Math.abs(Math.round(Math.sin(t * 0.8) * 10)); }
    if (feeding) oy += (t % 4 < 2 ? 2 : 0);

    if (pet.dead) {
      px(68, 50, 24, 36, '#9a9a9a'); px(66, 54, 28, 6, '#8a8a8a'); px(70, 46, 20, 8, '#9a9a9a');
      px(76, 60, 8, 3, '#555'); px(78, 58, 4, 10, '#555'); return;
    }
    // 3D 스프라이트 그리기. 3D 1단위 = 캔버스 46px, 발밑(gnd)이 지면 y=86 에 오도록 배치
    const sid = spriteId(pet), im = sprite(sid), a = ANCH[sid];
    const U = 46, cell = U * SPAN;
    const wob = stage === 0 ? Math.sin(t * 0.3) : 0;
    const X0 = 80 + (ox - 64) + wob - a.gnd[0] * cell, Y0 = 86 + (oy - 30) - (1 - a.gnd[1]) * cell;
    const ax = u => X0 + u * cell, ay = v => Y0 + (1 - v) * cell;
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(ax(a.gnd[0]), 87, (a.bbox[2] - a.bbox[0]) * cell * .32, 3, 0, 0, 7); ctx.fill();
    if (im.complete && im.naturalWidth) ctx.drawImage(im, X0, Y0, cell, cell);
    else { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(80, 70, 12, 0, 7); ctx.fill(); }
    if (stage === 0) return;
    const sx = ax(a.bbox[0]), sy = ay(a.bbox[3]), ssize = (a.bbox[2] - a.bbox[0]) * cell, bh = (a.bbox[3] - a.bbox[1]) * cell;
    const u = U * 0.5 / 8 * (stage === 1 ? 0.8 : 1);
    const box = { top: ay(a.top[1]), headCX: ax(a.eye[0]), headW: u * 8, u, eyeY: ay(a.eye[1]) - u, neckY: ay(a.eye[1]) + u * 2.6, outfitY: ay(a.eye[1]) + u * 4,
                  bodyCX: ax(a.eye[0]) + u, bodyTop: sy, bodyH: bh };
    drawWear(box);

    ctx.font = '12px sans-serif';
    if (pet.sleeping) { ctx.fillStyle = '#fff'; ctx.fillText('z', sx + ssize + 2 + (t % 20) / 4, sy + 6 - (t % 20) / 3); ctx.fillText('Z', sx + ssize + 8 + (t % 20) / 3, sy - 2 - (t % 20) / 2); }
    if (pet.sick) ctx.fillText('💀', sx + ssize, sy + 8);
    if (feeding) { ctx.font = '14px sans-serif'; ctx.fillText('🍖', sx - 18, sy + bh * 0.6); }
    if (anim.action === 'heart' && Date.now() < anim.actionUntil) ctx.fillText('❤', sx + ssize / 2 - 4, sy - 8 - (t % 10));
    if (pet.hunger < 25 && !pet.sleeping) { ctx.font = '10px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillRect(sx + ssize + 2, sy - 6, 22, 14); ctx.fillStyle = '#222'; ctx.fillText('🍖?', sx + ssize + 3, sy + 5); }
  }
  function drawWeatherTag() {
    const w = weatherOf(pet);
    ctx.font = '10px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(2, 2, 40, 13);
    ctx.fillStyle = '#333'; ctx.fillText(w.icon + ' ' + w.name, 4, 12);
  }
  function render(t) { drawBg(t); drawDecoBack(t); drawPoop(pet.poop); drawPet(t); drawWeatherTag(); }

  function updateUI() {
    if (!pet) return;
    const st = stageOf(pet); const sp = speciesOf(pet);
    $('hudName').textContent = pet.name;
    $('hudStage').textContent = pet.dead ? '😢' : (st === 3 && sp ? sp.name : STAGES[st].name) + (pet.sleeping ? ' 💤' : '') + (pet.sick ? ' 🤒' : '');
    $('hudAge').textContent = ageDays(pet) + '일 ' + pet.weight.toFixed(1) + 'g';
    $('hudPts').textContent = '💖 ' + Math.floor(shop.points);
    $('bHunger').style.width = pet.hunger + '%'; $('bHappy').style.width = pet.happy + '%';
    $('bEnergy').style.width = pet.energy + '%'; $('bHealth').style.width = pet.health + '%';
    ['btnFeed', 'btnPlay', 'btnSleep', 'btnClean', 'btnMed'].forEach(id => $(id).disabled = pet.dead || st === 0);
    $('btnSleep').querySelector('span').textContent = pet.sleeping ? '☀️' : '💤';
    $('btnSleep').lastChild.textContent = pet.sleeping ? '깨우기' : '잠자기';
    $('speedBtn').textContent = '⏩ ' + SPEEDS[speedIdx] + 'x';
    if (pet.dead) showOverlay('😢 ' + pet.name + '가 떠났어요', `${ageDays(pet)}일 동안 함께했어요.${sp ? '\n최종 형태: ' + sp.name : ''}\n새로운 알을 받아볼까요?\n(포인트·아이템·도감은 유지돼요)`, '새 알 받기');
  }

  // ================= 액션 =================
  function act(kind) {
    if (pet.dead || stageOf(pet) === 0) return;
    if (pet.sleeping && kind !== 'sleep') { showMsg('자고 있어요… 먼저 깨워주세요'); return; }
    switch (kind) {
      case 'feed':
        if (pet.hunger >= 95) { showMsg('배가 너무 불러요!'); pet.happy = clamp(pet.happy - 5); break; }
        pet.hunger = clamp(pet.hunger + 25); pet.weight += 0.3; pet.poop = clamp(pet.poop + 0.5, 0, 4);
        anim = { action: 'feed', actionUntil: Date.now() + 1500 }; showMsg('냠냠! 🍖'); break;
      case 'play':
        if (pet.energy < 15) { showMsg('너무 피곤해요… 😩'); break; }
        pet.happy = clamp(pet.happy + 20); pet.energy = clamp(pet.energy - 15); pet.hunger = clamp(pet.hunger - 5); pet.weight = Math.max(1, pet.weight - 0.2); pet.playCount++;
        if (pet.happy >= 70) { shop.points += 3; showMsg('재밌어요! 🎉 +3💖'); } else showMsg('재밌어요! 🎉');
        anim = { action: 'play', actionUntil: Date.now() + 2000 }; break;
      case 'sleep':
        pet.sleeping = !pet.sleeping; showMsg(pet.sleeping ? '잘 자요… 💤 (에너지 회복 중)' : '좋은 아침! ☀️'); break;
      case 'clean':
        if (pet.poop < 1) { showMsg('이미 깨끗해요 ✨'); break; }
        pet.poop = 0; pet.happy = clamp(pet.happy + 5); anim = { action: 'heart', actionUntil: Date.now() + 1200 }; showMsg('깨끗해졌어요 ✨'); break;
      case 'med':
        if (!pet.sick) { showMsg('아프지 않아요. 약은 맛없어요 😣'); pet.happy = clamp(pet.happy - 8); break; }
        pet.sick = false; pet.health = clamp(pet.health + 20); anim = { action: 'heart', actionUntil: Date.now() + 1200 }; showMsg('다 나았어요! 💊'); break;
    }
    updateUI(); save();
  }

  // ================= 오버레이 / 도감 / 상점 =================
  let selEl = ELEMENTS[0].id;
  function buildPalette() {
    const p = $('palette'); p.innerHTML = '';
    ELEMENTS.forEach(e => { const d = document.createElement('div'); d.className = 'swatch' + (e.id === selEl ? ' sel' : ''); d.style.background = e.color; d.textContent = e.icon; d.onclick = () => { selEl = e.id; buildPalette(); }; p.appendChild(d); });
    const e = ELEMENTS.find(x => x.id === selEl);
    $('elHint').textContent = `${e.icon} ${e.name} 속성 → ${SPECIES[e.id].map(s => s.name).join(' · ')}`;
  }
  function showOverlay(title, text, btn) {
    $('ovTitle').textContent = title; $('ovText').textContent = text; $('ovBtn').textContent = btn;
    buildPalette(); $('overlay').classList.add('show');
  }
  $('ovBtn').onclick = () => {
    const name = $('nameInput').value.trim() || '타마';
    pet = defaultPet(name, selEl);
    pet.gameMs = GAME_DAY_MS - 90000; // 알은 90초 뒤 부화 (1배속)
    lastStage = 0;
    $('overlay').classList.remove('show'); save(); updateUI(); showMsg('알이 꿈틀거려요… 잠시 기다려주세요 🥚', 3000);
  };
  let resetting = false;
  $('resetBtn').onclick = () => { if (confirm('정말 초기화할까요? 현재 다마고치가 사라져요.\n(도감·포인트·아이템은 유지)')) { resetting = true; pet = null; localStorage.removeItem(SAVE_KEY); location.reload(); } };

  function openDex() {
    const found = loadJSON(DEX_KEY, []); const body = $('dexBody'); body.innerHTML = '';
    $('dexCount').textContent = `${found.length}/30`;
    ELEMENTS.forEach(e => {
      const h = document.createElement('div'); h.className = 'sec-title'; h.textContent = `${e.icon} ${e.name}`; body.appendChild(h);
      const g = document.createElement('div'); g.className = 'dex-grid';
      SPECIES[e.id].forEach((sp, i) => {
        const key = e.id + ':' + i, ok = found.includes(key);
        const cell = document.createElement('div'); cell.className = 'dex-cell' + (ok ? '' : ' locked');
        const c = document.createElement('canvas'); c.width = 120; c.height = 120;
        drawThumb(c, FINAL_ID[e.id][i], !ok);
        cell.appendChild(c);
        const n = document.createElement('div'); n.textContent = ok ? sp.name : '???'; cell.appendChild(n);
        const b = document.createElement('div'); b.style.opacity = .7; b.textContent = BRANCHES[i]; cell.appendChild(b);
        cell.title = BRANCH_HINT[i]; g.appendChild(cell);
      });
      body.appendChild(g);
    });
    const note = document.createElement('div'); note.className = 'note';
    note.innerHTML = '<b>분기 조건 (어른 진화 시 판정, 우선순위 순)</b><br>' + ['그늘', '정성', '튼튼', '민첩', '기본'].map(n => { const i = BRANCHES.indexOf(n); return `${n}: ${BRANCH_HINT[i]}`; }).join('<br>');
    body.appendChild(note);
    $('dex').classList.add('show');
  }
  $('dexBtn').onclick = openDex;
  $('dexClose').onclick = () => $('dex').classList.remove('show');

  function openShop() {
    const body = $('shopBody'); body.innerHTML = '';
    $('shopPts').textContent = `💖 ${Math.floor(shop.points)}`;
    const mkRow = (icon, name, sub, btnLabel, btnOn, onClick, disabled) => {
      const row = document.createElement('div'); row.className = 'shop-row';
      const c = document.createElement('canvas'); c.width = 32; c.height = 32; icon(c.getContext('2d')); row.appendChild(c);
      const nm = document.createElement('div'); nm.className = 'nm'; nm.innerHTML = `${name}<small>${sub}</small>`; row.appendChild(nm);
      const b = document.createElement('button'); b.textContent = btnLabel; if (btnOn) b.className = 'on'; b.disabled = !!disabled; b.onclick = onClick; row.appendChild(b);
      body.appendChild(row);
    };
    const slotName = { hat: '머리', face: '얼굴', neck: '목', outfit: '옷' };
    ['hat', 'face', 'neck', 'outfit'].forEach(slot => {
      const h = document.createElement('div'); h.className = 'sec-title'; h.textContent = `👒 ${slotName[slot]}`; body.appendChild(h);
      ITEMS.filter(i => i.slot === slot).forEach(it => {
        const owned = shop.owned.includes(it.id), on = shop.equip[slot] === it.id;
        const s = Math.floor(28 / Math.max(8, it.map.length));
        mkRow(cc => drawMap(cc, it.map, it.pal, (32 - 8 * s) / 2, (32 - it.map.length * s) / 2, s),
          it.name, owned ? '보유 중' : `${it.price} 💖`,
          owned ? (on ? '해제' : '착용') : '구매', on,
          () => {
            if (!owned) { if (shop.points < it.price) { showMsg('포인트가 부족해요 💔'); return; } shop.points -= it.price; shop.owned.push(it.id); shop.equip[slot] = it.id; showMsg(`${it.name} 구매! 바로 착용했어요`); }
            else shop.equip[slot] = on ? null : it.id;
            save(); updateUI(); openShop();
          }, !owned && shop.points < it.price);
      });
    });
    const h = document.createElement('div'); h.className = 'sec-title'; h.textContent = '🏡 방 꾸미기'; body.appendChild(h);
    DECOS.forEach(d => {
      const owned = shop.owned.includes(d.id), on = decoOn(d.id);
      mkRow(cc => {
        if (d.map) { const s = Math.floor(28 / Math.max(d.map[0].length, d.map.length)); drawMap(cc, d.map, d.pal, (32 - d.map[0].length * s) / 2, (32 - d.map.length * s) / 2, s); }
        else { cc.font = '18px sans-serif'; cc.textAlign = 'center'; cc.fillText({ flowers: '🌷', fence: '🪵', rug: '🟥', sign: '🪧', garland: '✨' }[d.id], 16, 23); }
      }, d.name, (owned ? '보유 중 · ' : `${d.price} 💖 · `) + d.desc,
        owned ? (on ? '끄기' : '켜기') : '구매', on,
        () => {
          if (!owned) { if (shop.points < d.price) { showMsg('포인트가 부족해요 💔'); return; } shop.points -= d.price; shop.owned.push(d.id); shop.deco.push(d.id); showMsg(`${d.name} 설치!`); }
          else { if (on) shop.deco = shop.deco.filter(x => x !== d.id); else shop.deco.push(d.id); }
          save(); updateUI(); openShop();
        }, !owned && shop.points < d.price);
    });
    const note = document.createElement('div'); note.className = 'note';
    note.textContent = '💖 행복 포인트: 깨어 있고 행복 70 이상일 때 게임 1시간당 10점, 행복한 상태로 놀아주면 +3. 포인트·아이템은 다마고치가 바뀌어도 유지돼요.';
    body.appendChild(note);
    $('shop').classList.add('show');
  }
  $('btnShop').onclick = openShop;
  $('shopClose').onclick = () => $('shop').classList.remove('show');

  $('btnFeed').onclick = () => act('feed');
  $('btnPlay').onclick = () => act('play');
  $('btnSleep').onclick = () => act('sleep');
  $('btnClean').onclick = () => act('clean');
  $('btnMed').onclick = () => act('med');
  $('lightBtn').onclick = () => { lightsOff = !lightsOff; showMsg(lightsOff ? '조명 꺼짐 🌙' : '조명 켜짐 💡'); };
  $('speedBtn').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; localStorage.setItem('colorTama_speed', speedIdx); updateUI(); showMsg(`배속 ${SPEEDS[speedIdx]}x (게임 1일 = 실시간 ${(60 / SPEEDS[speedIdx]).toFixed(0)}분)`); };

  // ================= 초기화 =================
  shop = loadJSON(SHOP_KEY, defaultShop());
  speedIdx = parseInt(localStorage.getItem('colorTama_speed') || '0') || 0;
  pet = loadJSON(SAVE_KEY, null);
  if (!pet) showOverlay('🥚 새 알이 도착했어요!', '이름을 정하고 속성 색을 골라주세요.\n속성과 키우는 방식에 따라 30종 중 하나로 최종 진화해요.', '시작하기');
  else {
    const gap = Date.now() - pet.last;
    if (gap > 60000) { tick(gap, 1); showMsg(`${(gap / 3600000).toFixed(1)}시간 동안 자리를 비웠어요 (1배속 적용)`, 3000); }
    pet.last = Date.now();
    if (stageOf(pet) === 3 && !pet.species && !pet.dead) evolveFinal();
    save();
  }
  updateUI();

  let frame = 0, lastStage = pet ? stageOf(pet) : 0;
  setInterval(() => {
    if (!pet) return;
    frame++;
    if (frame % 10 === 0) {
      const now = Date.now(); tick(now - pet.last, SPEEDS[speedIdx]); pet.last = now;
      const st = stageOf(pet);
      if (st !== lastStage) {
        lastStage = st; pet.happy = 100;
        if (st === 3) evolveFinal(); else showMsg(`🎉 ${STAGES[st].name}(으)로 성장했어요!`, 3000);
        save();
      }
      updateUI();
      if (frame % 300 === 0) save();
    }
    render(frame);
  }, 100);
  window.addEventListener('beforeunload', () => { if (!resetting && pet) save(); });
  window.addEventListener('pagehide', () => { if (!resetting && pet) save(); });        // iOS 는 beforeunload 가 안 올 수 있음
  document.addEventListener('visibilitychange', () => { if (document.hidden && !resetting && pet) save(); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
