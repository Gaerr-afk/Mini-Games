<title>에린 견습생 육성기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .device { width: min(390px, calc(100vw - 10px)); background: linear-gradient(160deg, #6d4c9c, #9b7bd1); border-radius: 28px; padding: 18px 20px 20px; box-shadow: 0 25px 60px rgba(0,0,0,.55), inset 0 -6px 16px rgba(0,0,0,.2), inset 0 6px 12px rgba(255,255,255,.3); position: relative; }

  .screen { background: #e9e2d0; border-radius: 10px; overflow: hidden; position: relative; }
  canvas { display: block; width: 100%; image-rendering: pixelated; }
  .stage { position: relative; }
  #gl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: auto; }
  canvas.c3d { image-rendering: auto; }
  .overlay input { -webkit-user-select: text; user-select: text; }
  .hud { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px 2px; font-size: 11px; font-weight: 700; color: #3b2a4a; }
  .hud .lv { background: #6d4c9c; color: #fff; border-radius: 8px; padding: 1px 6px; font-size: 10px; }
  .xp { height: 4px; background: #cbbfae; margin: 0 10px; border-radius: 2px; overflow: hidden; } .xp i { display: block; height: 100%; background: #f5b700; transition: width .3s; }
  .stats { padding: 4px 10px 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
  .stat { font-size: 10px; color: #3b2a4a; font-weight: 700; }
  .bar { height: 6px; background: #cbbfae; border-radius: 3px; overflow: hidden; margin-top: 1px; } .bar i { display: block; height: 100%; border-radius: 3px; transition: width .3s; }
  .attrs { display: flex; justify-content: space-between; padding: 2px 10px 4px; font-size: 9px; color: #5a4a6a; font-weight: 700; }
  .log { height: 40px; overflow: hidden; background: #d9d0bd; margin: 0 8px 8px; border-radius: 6px; padding: 3px 6px; font-size: 9px; line-height: 1.45; color: #333; }
  .msg { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.93); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; color: #333; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; z-index: 2; }

  .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  button { border: none; border-radius: 12px; padding: 10px 4px; font-size: 12px; font-weight: 800; cursor: pointer; background: #f6f1ff; color: #4a2d7a; box-shadow: 0 4px 0 #3f2a63, 0 6px 10px rgba(0,0,0,.25); transition: transform .05s, box-shadow .05s; }

  button span { display: block; font-size: 17px; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 10px; color: #fff; opacity: .9; }
  .footer a { color: #fff; cursor: pointer; text-decoration: underline; margin-left: 9px; }
  .footer a.speed { background: rgba(255,255,255,.25); padding: 2px 7px; border-radius: 8px; text-decoration: none; font-weight: 800; }
  .overlay { position: absolute; inset: 0; background: rgba(20,12,35,.94); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: safe center; text-align: center; padding: 12px; gap: 8px; z-index: 3; overflow-y: auto; }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 17px; } .overlay p { font-size: 10px; line-height: 1.5; opacity: .9; white-space: pre-line; }

  .overlay button { padding: 7px 18px; font-size: 11px; }
  .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip { padding: 4px 8px; border-radius: 10px; background: rgba(255,255,255,.12); font-size: 10px; cursor: pointer; border: 2px solid transparent; }
  .chip.sel { border-color: #ffd93d; background: rgba(255,217,61,.2); }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; } .sw.sel { border-color: #fff; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
  .choice { background: rgba(255,255,255,.1); border-radius: 10px; padding: 6px; text-align: left; font-size: 10px; cursor: pointer; border: 2px solid transparent; display: flex; gap: 6px; align-items: center; }

  .choice b { display: block; font-size: 11px; } .choice small { opacity: .8; display: block; line-height: 1.3; }
  .panel { position: absolute; inset: 0; background: #22182f; color: #fff; display: none; flex-direction: column; z-index: 3; }
  .panel.show { display: flex; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 12px; font-weight: 800; background: #140e1e; }
  .panel-head a { cursor: pointer; text-decoration: underline; font-weight: 400; }
  .panel-body { overflow-y: auto; padding: 8px; flex: 1; font-size: 10px; }
  .sec-title { font-size: 11px; font-weight: 800; margin: 6px 0 4px; }
  .tree { margin-bottom: 8px; background: rgba(255,255,255,.06); border-radius: 8px; padding: 6px; }

<body>

  }

    ctx.font = '11px sans-serif'; ctx.fillStyle = '#fff';
    if (ch.resting) { ctx.fillText('z', cx + 20 + (t % 20) / 4, 30 - (t % 20) / 3); }
    if (anim.action === 'train' && Date.now() < anim.until) ctx.fillText('💪', cx + 18, 36);
    if (anim.action === 'eat' && Date.now() < anim.until) ctx.fillText('🍞', cx - 28, 60);
    if (ch.hun < 20 && !ch.resting) { ctx.fillStyle = '#fff'; ctx.fillRect(cx + 16, 20, 24, 14); ctx.fillStyle = '#222'; ctx.font = '10px sans-serif'; ctx.fillText('🍞?', cx + 18, 31); }
    // 태그
    ctx.font = '9px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(2, 2, 58, 12); ctx.fillStyle = '#333'; ctx.fillText(`${ageOf(ch)} · ${hunting ? z.name : '캠프'}`, 4, 11);
  }
  function updateUI() {
    if (!ch) return;
    $('hudName').textContent = ch.name; $('hudClass').textContent = className(ch);
    $('hudLv').textContent = 'Lv ' + ch.level; $('hudGold').textContent = '💰 ' + ch.gold;
    $('xpBar').style.width = (ch.level >= MAX_LEVEL ? 100 : ch.exp / needExp(ch.level) * 100) + '%';
    $('bHp').style.width = ch.hp + '%'; $('bSta').style.width = ch.sta + '%'; $('bHun').style.width = ch.hun + '%'; $('bMood').style.width = ch.mood + '%';
    $('nHp').textContent = `${Math.round(ch.hp * maxHp(ch) / 100)}/${maxHp(ch)}`; $('nSta').textContent = `${Math.round(ch.sta * maxSta(ch) / 100)}/${maxSta(ch)}`;
    const main = famOf(ch).stat;
    $('attrs').innerHTML = ['체력', ...STATS].map(k => `<span style="${k === main ? 'color:#c0392b' : ''}">${k} ${Math.floor(ch.stats[k])}</span>`).join('');
    $('btnRest').querySelector('span').textContent = ch.resting ? '☀️' : '🔥';
    $('btnRest').lastChild.textContent = ch.resting ? '일어나기' : '휴식';
    $('speedBtn').textContent = '⏩ ' + SPEEDS[speedIdx] + 'x';
    $('zoneBtn').textContent = '📍' + ZONES[ch.zone].name;
    $('log').innerHTML = ch.log.map((l, i) => `<div style="opacity:${1 - i * .3}">${l}</div>`).join('');
  }

  // ================= 생성 / 패널 =================
  function openCreate() {
    const ov = $('overlay'); let fam = 0, hair = 0, hc = 0, sk = 0;
    const render = () => {
      const f = FAMILIES[fam];
      ov.innerHTML = `<h2>🌱 10살 견습생 등록</h2><input id="nm" maxlength="8" placeholder="이름" value="${String(ov.querySelector('#nm')?.value ?? '나오').replace(/[<>&"'`]/g, '')}">
        <div class="row" id="fams"></div><p id="fdesc"></p><div class="row" id="hairs"></div><div class="row" id="hcs"></div><div class="row" id="sks"></div>
        <div style="display:flex;gap:10px;align-items:center"><canvas id="pv" width="36" height="48" style="width:54px;height:72px;background:rgba(0,0,0,.3);border-radius:8px"></canvas><button id="goBtn">모험 시작</button></div>`;
      FAMILIES.forEach((x, i) => { const d = document.createElement('div'); d.className = 'chip' + (i === fam ? ' sel' : ''); d.textContent = x.icon + ' ' + x.name; d.onclick = () => { fam = i; render(); }; ov.querySelector('#fams').appendChild(d); });
      ov.querySelector('#fdesc').textContent = `주 스탯 ${f.stat} · 2차: ${f.t2.map(i => T2[i].name).join(' / ')}`;
      HAIRS.forEach((x, i) => { const d = document.createElement('div'); d.className = 'chip' + (i === hair ? ' sel' : ''); d.textContent = x.name; d.onclick = () => { hair = i; render(); }; ov.querySelector('#hairs').appendChild(d); });
      HAIR_COLORS.forEach((x, i) => { const d = document.createElement('div'); d.className = 'sw' + (i === hc ? ' sel' : ''); d.style.background = x; d.onclick = () => { hc = i; render(); }; ov.querySelector('#hcs').appendChild(d); });
      SKINS.forEach((x, i) => { const d = document.createElement('div'); d.className = 'sw' + (i === sk ? ' sel' : ''); d.style.background = x; d.onclick = () => { sk = i; render(); }; ov.querySelector('#sks').appendChild(d); });
      drawPreview(ov.querySelector('#pv'), { hair: HAIRS[hair].id, hairColor: HAIR_COLORS[hc], skin: SKINS[sk], armor: 'cloth', weapon: T2[f.t2[0]].weapon, head: 'none', col: { C: f.color, c: '#f5f5f5', P: '#5a4a3a' } }, 'kid');
      ov.querySelector('#goBtn').onclick = () => { ch = defaultChar(ov.querySelector('#nm').value.replace(/[<>&"'`]/g, '').trim() || '나오', f.id, HAIRS[hair].id, HAIR_COLORS[hc], SKINS[sk]); ov.classList.remove('show'); log(`${ch.name}, ${f.name} 견습생으로 모험을 시작!`); save(); updateUI(); };
    };
    render(); ov.classList.add('show');
  }
  function openTree() {
    if (busy()) return;
    const body = $('treeBody'); body.innerHTML = ''; const dex = loadJSON(DEX_KEY, []);
    const f = famOf(ch);
    const info = document.createElement('div'); info.className = 'note';
    info.innerHTML = `<b>${ch.name}</b> · ${ageOf(ch)} · ${className(ch)} · 전투력 ${Math.floor(power(ch))}<br>사냥 ${ch.hunts}회 · 훈련 ${ch.trains}회 · 1차 전직 Lv${T2_LEVEL} · 최종 전직 Lv${T3_LEVEL}`; body.appendChild(info);
    if (ch.tier === 1 && ch.level >= T3_LEVEL) { const b = document.createElement('button'); b.textContent = '👑 최종 전직하기'; b.style.margin = '6px 0'; b.onclick = () => { $('tree').classList.remove('show'); openPromotion3(); }; body.appendChild(b); }
    FAMILIES.forEach(fm => {
      const d = document.createElement('div'); d.className = 'tree';
      let html = `<div class="${fm.id === ch.fam ? 'cur' : ''}"><b>${fm.icon} ${fm.name}</b> (주 스탯 ${fm.stat})</div>`;
      fm.t2.forEach((id, i) => {
        const t = T2[id]; html += `<div class="t2 ${ch.t2 === id ? 'cur' : ''}">${i === 0 ? '↳ (유지) ' : '↳ '}${t.name} <span style="opacity:.6">${t.desc}</span></div>`;
        html += `<div class="t3">` + T3[id].map((x, j) => `<span class="${ch.t2 === id && ch.t3 === j ? 'cur' : dex.includes(id + ':' + j) ? 'got' : ''}" title="${reqText(x.req)}">${x.name}</span>`).join(' · ') + `</div>`;
      });
      d.innerHTML = html; body.appendChild(d);
    });
    const note = document.createElement('div'); note.className = 'note'; note.innerHTML = `최종 직업 ${dex.length}/72 달성. 노란색 = 현재, 초록색 = 달성한 적 있음. 최종 직업 이름 위에 마우스를 올리면 조건이 보여요.`; body.appendChild(note);
    $('tree').classList.add('show');
  }
  function openShop() {
    if (busy()) return;
    const body = $('shopBody'); body.innerHTML = ''; $('shopGold').textContent = `💰 ${ch.gold}`;
    const wCost = 60 * (ch.weaponLv + 1) * (ch.weaponLv + 1);
    const rows = [
      { icon: '🍞', name: '빵', sub: `포만 +40 · 보유 ${ch.bread}`, cost: 12, fn: () => { ch.bread++; } },
      { icon: '🧪', name: '회복 물약', sub: `생명 50% 회복 · 보유 ${ch.potions}`, cost: 35, fn: () => { ch.potions++; } },
      { icon: '💊', name: '물약 사용', sub: '보유 물약으로 생명 50% 회복', cost: 0, dis: ch.potions <= 0, fn: () => { ch.potions--; ch.hp = clamp(ch.hp + 50); } },
      { icon: '🎵', name: '여관 공연 관람', sub: '기분 +30', cost: 25, fn: () => { ch.mood = clamp(ch.mood + 30); } },
      { icon: '⚒️', name: `무기 강화 +${ch.weaponLv + 1}`, sub: `전투력 +8 (현재 +${ch.weaponLv})`, cost: wCost, dis: ch.weaponLv >= 10, fn: () => { ch.weaponLv++; } },
    ];
    rows.forEach(r => {
      const row = document.createElement('div'); row.className = 'shop-row';
      row.innerHTML = `<span style="font-size:18px">${r.icon}</span><div class="nm">${r.name}<small>${r.sub}</small></div>`;
      const b = document.createElement('button'); b.textContent = r.cost ? `${r.cost}G` : '사용'; b.disabled = r.dis || ch.gold < r.cost;
      b.onclick = () => { ch.gold -= r.cost; r.fn(); showMsg(`${r.name} 완료`); save(); updateUI(); openShop(); }; row.appendChild(b); body.appendChild(row);
    });
    const sec = t => { const h = document.createElement('div'); h.className = 'sec-title'; h.textContent = t; body.appendChild(h); };
    const mk = (icon, name, sub, label, dis, fn) => {
      const row = document.createElement('div'); row.className = 'shop-row';
      if (typeof icon === 'string') row.innerHTML = icon; else row.appendChild(icon);
      const nm = document.createElement('div'); nm.className = 'nm'; nm.innerHTML = `${name}<small>${sub}</small>`; row.appendChild(nm);
      const b = document.createElement('button'); b.textContent = label; b.disabled = dis; b.onclick = () => { fn(); save(); updateUI(); openShop(); }; row.appendChild(b); body.appendChild(row);
    };
    const sw = col => `<span style="width:20px;height:20px;border-radius:50%;background:${col};border:2px solid rgba(255,255,255,.5);flex:none"></span>`;
    const pay = (cost, fn) => () => { ch.gold -= cost; fn(); };
    const cos = ch.cos;
    sec('💇 미용실 (헤어 변경 40G · 염색 30G)');
    HAIRS.forEach(hs => { if (hs.id !== ch.hair) mk('<span style="font-size:18px">✂️</span>', hs.name, '머리 모양 변경', '40G', ch.gold < 40, pay(40, () => { ch.hair = hs.id; showMsg(`${hs.name}(으)로 변신!`); })); });
    DYE_HAIR.forEach(col => { if (col !== ch.hairColor) mk(sw(col), '머리 염색약', '머리색 변경', '30G', ch.gold < 30, pay(30, () => { ch.hairColor = col; showMsg('머리를 염색했어요'); })); });
    sec('👕 의상 염색 (60G)');
    if (cos.dye) mk('<span style="font-size:18px">🧽</span>', '염색 제거', '직업 기본 색으로', '무료', false, () => { cos.dye = null; });
    DYE_CLOTH.forEach(([n, col]) => { if (col !== cos.dye) mk(sw(col), `${n} 염색약`, '상의 색 변경 (전직해도 유지)', '60G', ch.gold < 60, pay(60, () => { cos.dye = col; showMsg(`${n}색으로 염색!`); })); });
    sec('👒 머리 장식 (구매 후 자유 착용)');
    COS_HEADS.forEach(([id, n, price]) => {
      const cvs = document.createElement('canvas'); cvs.width = 24; cvs.height = 18; cvs.style.cssText = 'width:32px;height:24px;flex:none;image-rendering:pixelated';
      let icon3d = false;
      if (G3 && G3.ok) { cvs.width = 128; cvs.height = 96; icon3d = G3.preview(cvs, { ...lookOf(ch), head: id }, 'adult', { head: true }); if (icon3d) cvs.style.imageRendering = 'auto'; else { cvs.width = 24; cvs.height = 18; } }
      if (!icon3d) { const hd = HEADS[id]; drawMapTo(cvs.getContext('2d'), hd.map, { C: '#aaa', c: '#e74c3c', H: ch.hairColor, ...hd.pal }, 0, (18 - hd.map.length * 3) / 2, 3); }
      const key = 'head:' + id, own = cos.owned.includes(key), on = cos.head === id;
      mk(cvs, n, own ? (on ? '착용 중' : '보유 중') : '직업 머리장식 대신 착용', own ? (on ? '해제' : '착용') : price + 'G', !own && ch.gold < price,
        () => { if (!own) { ch.gold -= price; cos.owned.push(key); cos.head = id; showMsg(`${n} 구매!`); } else cos.head = on ? null : id; });
    });
    sec('🧣 망토 (구매 후 자유 착용)');
    COS_CAPES.forEach(([n, col, price]) => {
      const key = 'cape:' + col, own = cos.owned.includes(key), on = cos.cape === col;
      mk(sw(col), n, own ? (on ? '착용 중' : '보유 중') : '등 뒤에 두르는 망토', own ? (on ? '해제' : '착용') : price + 'G', !own && ch.gold < price,
        () => { if (!own) { ch.gold -= price; cos.owned.push(key); cos.cape = col; showMsg(`${n} 구매!`); } else cos.cape = on ? null : col; });
    });
    $('shop').classList.add('show');
  }
  function cycleZone() {
    if (busy()) return;
    const avail = ZONES.filter(z => ch.level >= z.lv);
    ch.zone = (ch.zone + 1) % avail.length;
    const next = ZONES[avail.length] ? ` (다음: ${ZONES[avail.length].name} Lv${ZONES[avail.length].lv})` : '';
    showMsg(`📍 사냥터: ${ZONES[ch.zone].name} (적 전투력 ${ZONES[ch.zone].power}, 내 전투력 ${Math.floor(power(ch))})${next}`, 3000); updateUI(); save();
  }

  $('btnHunt').onclick = () => act('hunt'); $('btnTrain').onclick = () => act('train'); $('btnRest').onclick = () => act('rest'); $('btnEat').onclick = () => act('eat');
  $('btnShop').onclick = openShop; $('shopClose').onclick = () => $('shop').classList.remove('show');
  $('btnTree').onclick = openTree; $('treeClose').onclick = () => $('tree').classList.remove('show');
  $('zoneBtn').onclick = cycleZone;
  $('speedBtn').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; localStorage.setItem(SPEED_KEY, speedIdx); updateUI(); showMsg(`배속 ${SPEEDS[speedIdx]}x (체력 회복 속도)`); };
  $('resetBtn').onclick = () => { if (confirm('정말 초기화할까요? 캐릭터가 사라져요.\n(최종 직업 달성 기록은 유지)')) { resetting = true; ch = null; localStorage.removeItem(SAVE_KEY); location.reload(); } };

  // ================= 시작 =================
  speedIdx = parseInt(localStorage.getItem(SPEED_KEY) || '0') || 0;
  ch = loadJSON(SAVE_KEY, null);
  if (!ch) openCreate();
  else { if (!ch.cos) ch.cos = { owned: [], head: null, cape: null, dye: null }; const gap = Date.now() - ch.last; if (gap > 60000) { tick(gap, 1); showMsg(`${(gap / 3600000).toFixed(1)}시간 동안 자리를 비웠어요`, 3000); } ch.last = Date.now(); save(); checkPromotion(); }
  updateUI();
  let frame = 0;
  setInterval(() => {
    if (!ch) return; frame++;
    if (frame % 10 === 0) { const now = Date.now(); tick(now - ch.last, SPEEDS[speedIdx]); ch.last = now; updateUI(); if (frame % 300 === 0) save(); }
    drawScene(frame);
  }, 100);
  const saveNow = () => { if (!resetting && ch) save(); };
  window.addEventListener('beforeunload', saveNow);
  window.addEventListener('pagehide', saveNow);                                   // iOS 사파리는 beforeunload 가 오지 않는다
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
